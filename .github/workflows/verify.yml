name: Verify prototype

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Record dependency audit
        continue-on-error: true
        run: npm audit --json > npm-audit.json
      - name: Validate manuscript graph
        run: npm run validate:story
      - name: Run unit and integration tests
        run: npm test
      - name: Run native engine regression checks
        run: npm run test:native
      - name: Build production app
        id: build
        run: npm run build
      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop flows
        run: npm run test:e2e
      - name: Verify production offline PWA and private-network preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:pwa
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-verification
          path: |
            dist/
            package-lock.json
            npm-audit.json
            test-results/
          if-no-files-found: ignore
